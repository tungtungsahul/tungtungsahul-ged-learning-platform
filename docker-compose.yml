services:
  postgres:
    image: postgres:16-alpine
    container_name: ged-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ged
      POSTGRES_PASSWORD: ged_password
      POSTGRES_DB: ged_platform
    ports:
      - "5432:5432"
    volumes:
      - ged_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ged -d ged_platform"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  ged_postgres_data:
